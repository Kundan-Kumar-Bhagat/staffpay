services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  api:
    build: ./server
    restart: unless-stopped
    ports: ["5000:5000"]
    env_file: ./server/.env          # set MONGO_URI=mongodb://mongo:27017/staffpay
    depends_on: [mongo]

volumes:
  mongo-data: